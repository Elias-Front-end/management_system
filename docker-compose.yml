version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "80:80"
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
    env_file:
      - .env.development
    depends_on:
      - db
    # No volume mount – code baked into image
    # Command defined in Dockerfile (Gunicorn + Nginx)

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  media_volume: